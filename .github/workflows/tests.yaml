---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          experimental: true
          install_args: --locked

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run unit tests
        run: mise run test

      # Surface the total coverage that `mise run test` already computes into
      # cover.out — it was otherwise generated and discarded. Reported only (no
      # threshold gate): a minimum-coverage policy is the maintainer's call.
      - name: Report coverage
        run: |
          set -o pipefail
          if [ ! -f cover.out ]; then
            echo "cover.out missing; the test step did not produce a coverage profile" >&2
            exit 1
          fi
          total="$(go tool cover -func=cover.out | tail -1)"
          echo "$total"
          {
            echo "### Coverage"
            echo '```'
            echo "$total"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
